name: Generate Cargo lock once

on:
  push:
    branches: ["feat/personal-knowledge-os-v1"]

permissions:
  contents: write

jobs:
  lock:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/personal-knowledge-os-v1
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - name: Commit Cargo.lock
        run: |
          if git diff --quiet -- Cargo.lock && git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo "Cargo.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: lock Rust dependencies"
          git push origin HEAD:feat/personal-knowledge-os-v1
