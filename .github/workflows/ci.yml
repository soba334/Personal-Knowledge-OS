name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t personal-knowledge-os:test .
      - name: Build PostgreSQL extension image
        run: docker build -f docker/postgres/Dockerfile -t personal-knowledge-os-postgres:test .

  integration:
    needs: [rust, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      PKOS_OWNER_ID: 00000000-0000-0000-0000-000000000001
      PKOS_API_KEY: ci-pkos-api-key-0123456789abcdef0123456789abcdef
      PKOS_WORKER_ENABLED: "false"
      PKOS_MEMORY_EXTRACTION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Start production-shaped stack
        run: docker compose up -d --build
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready" >&2
          exit 1
      - name: Exercise authenticated source, memory, graph, and timeline flows
        run: python3 scripts/smoke_test.py --api-key "$PKOS_API_KEY"
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
